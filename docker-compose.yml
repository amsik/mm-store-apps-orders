services:
  # Single-node replica set: Prisma needs one on MongoDB (Atlas provides it in production).
  mongo:
    # 8.2 rather than Atlas' 8.0: 8.0.x crashes at startup on Linux kernels >= 6.19 (SERVER-121912),
    # which recent Docker Desktop VMs ship. Integration tests still run 8.0 via mongodb-memory-server.
    image: mongo:8.2
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      # 27018 rather than 27017 so it doesn't clash with a local standalone mongod. Override with MONGO_PORT
      # (and adjust DATABASE_URL to match).
      - '${MONGO_PORT:-27018}:27017'
    volumes:
      - mongo-data:/data/db
    # Initiates rs0 on the first run and reports healthy once this node is PRIMARY. Clients connect
    # with `directConnection=true`, so the advertised `localhost` host works from the host machine too.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

  # One-shot: inserts the demo employees and orders (idempotent, fixed ids) and exits. `api`
  # waits for it, so a plain `docker compose up` always has data to demo against.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/prisma/seed.ts']
    environment:
      DATABASE_URL: mongodb://mongo:27017/mm-order?replicaSet=rs0&directConnection=true
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      # Override with API_PORT; keep WEB_PORT's VITE_API_URL build arg in sync if you do.
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: mongodb://mongo:27017/mm-order?replicaSet=rs0&directConnection=true
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked in at build time: the browser calls the API on its host-mapped port directly.
        VITE_API_URL: http://localhost:${API_PORT:-3000}/graphql
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      - api

volumes:
  mongo-data:
