services:
  # Single-node replica set: Prisma needs one on MongoDB (Atlas provides it in production).
  mongo:
    # 8.2 rather than Atlas' 8.0: 8.0.x crashes at startup on Linux kernels >= 6.19 (SERVER-121912),
    # which recent Docker Desktop VMs ship. Integration tests still run 8.0 via mongodb-memory-server.
    image: mongo:8.2
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      # Override with MONGO_PORT if a local mongod already uses 27017 (and adjust DATABASE_URL to match).
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    # Initiates rs0 on the first run and reports healthy once this node is PRIMARY. Clients connect
    # with `directConnection=true`, so the advertised `localhost` host works from the host machine too.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

volumes:
  mongo-data:
