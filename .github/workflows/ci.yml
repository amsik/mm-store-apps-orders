name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      # Also runs `prisma generate` through the api workspace's postinstall.
      - run: yarn install --immutable
      # mongod binary used by the integration tests' in-memory replica set (~100 MB download).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('apps/api/test/setup/mongo-replset.ts') }}
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      # The integration tests regenerate apps/api/schema.gql; a diff means the committed contract is stale.
      - name: Check GraphQL schema is up to date
        run: git diff --exit-code -- apps/api/schema.gql
      - run: yarn build

  pr-conventions:
    name: PR title & body
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # Passed through env (never interpolated into the script) to avoid shell injection from PR text.
      - run: yarn check:pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
